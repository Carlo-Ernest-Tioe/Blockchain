<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Medical Record Demo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Bisma.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

<div class="container">
    <header>
        <img src="Bisma.png">
        <div class="Artetanyahu">
            <h1>Bisma Medical Chain</h1>
            <p>Simulasi Integritas Data Rekam Medis Pasien</p>
        </div>
    </header>

    <div class="role-selector">
        <label for="currentRole">Login Sebagai:</label>
        <select id="currentRole" onchange="updateUIByRole()">
            <option value="doctor">Dokter (Input Data)</option>
            <option value="patient">Pasien (View Only)</option>
            <option value="admin">Admin IT</option>
        </select>
    </div>

    <div id="status" class="status-bar valid">SISTEM AMAN: Integritas Data Terverifikasi</div>

    <div class="form-group" id="inputForm">
        <input type="text" id="patientName" placeholder="Nama Pasien...">
        <input type="text" id="diagnosis" placeholder="Diagnosa Medis...">
        <button class="btn-add" onclick="addNewBlock()">Simpan ke Ledger</button>
    </div>

    <div id="chain">
        </div>
</div>
<script src="script.js"></script>
</body>
</html>
